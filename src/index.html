<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Movie Tickets Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Online Movie Tickets Booking</h1>

    <div class="movie-container">
        <label>Pick a movie:</label>
        <select id="movie">
            <option value="120">Animal (Rs120)</option>
            <option value="150">Jawan (Rs150)</option>
            <option value="200">Dunki (Rs200)</option>
        </select>
    </div>

    <ul class="showcase">
        <li><div class="seat"></div><small>N/A</small></li>
        <li><div class="seat selected"></div><small>Selected</small></li>
        <li><div class="seat occupied"></div><small>Occupied</small></li>
    </ul>

    <div class="screen"></div>

    <div class="row">
        <div class="seat"></div><div class="seat"></div><div class="seat"></div>
        <div class="seat"></div><div class="seat"></div><div class="seat"></div>
        <div class="seat"></div><div class="seat"></div>
    </div>
    <div class="row">
        <div class="seat"></div><div class="seat occupied"></div><div class="seat occupied"></div>
        <div class="seat"></div><div class="seat"></div><div class="seat"></div>
        <div class="seat occupied"></div><div class="seat"></div>
    </div>
    <div class="row">
        <div class="seat"></div><div class="seat"></div><div class="seat"></div>
        <div class="seat occupied"></div><div class="seat occupied"></div><div class="seat"></div>
        <div class="seat"></div><div class="seat"></div>
    </div>

    <p class="text">
        You have selected <span id="count">0</span> seats for a price of Rs<span id="total">0</span>
    </p>
</div>

<script src="script.js"></script>
</body>
</html>
